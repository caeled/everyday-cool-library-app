name: Build Windows exe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build LibraryApp
        run: python -m PyInstaller --noconfirm --clean --windowed --icon LibraryApp.ico --name LibraryApp --add-data "banner.png;." --add-data "LibraryApp.ico;." --add-data "README.md;." LibraryApp.py
      - name: Verify banner and docs in bundle
        run: |
          if (Test-Path "dist\LibraryApp\_internal\banner.png") { Write-Host "banner OK" } else { Write-Error "banner missing"; exit 1 }
          if (Test-Path "dist\LibraryApp\_internal\README.md") { Write-Host "README OK" } else { Write-Error "README missing"; exit 1 }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibraryApp-windows
          path: dist/LibraryApp
